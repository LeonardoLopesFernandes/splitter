name: Gerar APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar versões
        run: |
          flutter --version
          java -version

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Release (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: divisor-de-arquivos-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publicar Release (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true